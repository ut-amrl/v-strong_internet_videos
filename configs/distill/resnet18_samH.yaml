student:
  pretrained: true
  variant: resnet18
teacher:
  checkpoint: checkpoints/sam_vit_h_4b8939.pth
  img_size: 1024
  sam_variant: vit_h
trainer:
  accelerator: auto
  batch_size: 4
  devices:
  - 0
  fast_dev_run: false
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  max_epochs: 20
  num_nodes: 1
  num_workers: 4
  precision: 16-mixed
  seed: 0
  strategy: auto
