version: 1
name: "kerni_rc_v1"

output_dataset_dir: "data/kerni_rc_v1"

extraction:
  every_frame: true
  fps: 5

datagen:
  # Breadcrumbs (LK reverse chained tracking)
  center_offset_frac: 0.1
  boundary_thresh: 30
  breadcrumb_max_track_len: 20

  # SAM (breadcrumb-prompted)
  sam_ckpt: "checkpoints/sam_vit_b_01ec64.pth"
  sam_type: "vit_b"
  prompt_max_points: 32

  # Pos/neg sampling
  num_pos: 50
  num_neg: 50
  neg_top_frac: 0.3
  sample_margin_px: 10

  # Misc
  seed: 0
  resume: false
  write_viz: true
  viz_every_n: 10   # save debug viz every Nth frame (1 = all)

videos:
  - id: "kerni_rc_video1"
    video_dir: "videos/kerni_rc/video1"
    video_file: "video1.webm"
    chunks_time_file: "videos/kerni_rc/video1/chunks_time.yaml"

  - id: "kerni_rc_video2"
    video_dir: "videos/kerni_rc/video2"
    video_file: "video2.webm"
    chunks_time_file: "videos/kerni_rc/video2/chunks_time.yaml"
