  tensorboard_enabled: true
  tensorboard_name: tensorboard
  tensorboard_version: distill_resnet18_samH
  wandb_mode: disabled
  wandb_name: null
  wandb_project: vstrong
optimizer:
  lambda_cos: 0.5
  lambda_mse: 1.0
  lr: 0.0001
  weight_decay: 0.0001
paths:
